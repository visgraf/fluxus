<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluxus</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        
        /* --- FIX: Paint the body black so no white flashes during fades --- */
        background-color: black; 
      }

      /* --- Splash Screen Container --- */
      #splash_container {
        position: fixed;
        inset: 0;
        background-color: #1E1028; 
        z-index: 10; 
        
        /* Smooth fade transition */
        transition: opacity 0.3s ease-in-out; 
        opacity: 1; 
      }

      #splash_container.hidden {
        opacity: 0;
        pointer-events: none; 
      }

      /* --- Splash Screen Image --- */
      #splash_screen {
        position: absolute;
        inset: 0; 
        margin: auto; 
        width: 100vw;   
        height: 100vh;  
        object-fit: contain; 
        pointer-events: none; 
      }

      /* --- Splash Screen Text --- */
      #splash_text {
        position: absolute;
        bottom: calc(50% + 6vmin);
        transform: translateY(50%);
        width: 100%;
        text-align: center;
        
        color: white;
        font-size: 5vmin;   
        font-weight: bold;
        letter-spacing: 0.2em;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); 
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    
    <!-- Container wraps both image and text -->
    <div id="splash_container">
      <img id="splash_screen" src="/splash_screen.png" />
      <div id="splash_text">LOADING</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
